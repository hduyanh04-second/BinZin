<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile 🧸🌷 | Bin Zin</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/love_heart_icon.svg">
    <link rel="stylesheet" href="styles.css?v=11">
    <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
    <!-- Firebase (bản compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>

<body class="w-full">
    <div class="app-wrapper min-h-screen flex flex-col">
        <header class="border-b border-white/70 bg-white/50">
            <div class="mx-auto max-w-6xl px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                <a href="index.html" class="canva-button font-bold text-[#c85578]">BinZin World 💕</a>
                <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Mở menu"
                    aria-controls="main-nav" aria-expanded="false">
                    <span class="menu-bar"></span><span class="menu-bar"></span><span class="menu-bar"></span>
                </button>
                <nav id="main-nav" aria-label="Điều hướng chính" class="main-nav"></nav>
            </div>
        </header>

        <main class="mx-auto w-full max-w-5xl px-4 sm:px-5 py-8 md:py-12 flex-1">
            <h1 class="text-[#713d53]">Có hai người trong thế giới này 💕</h1>
            <p class="mt-3 text-[#876777]">Bấm vào từng cái tên để hiểu tụi mình hơn, có thể đổi ảnh đại diện và chỉnh sửa thông tin bất cứ lúc nào nha.</p>
            <p id="profile-status" role="status" aria-live="polite" class="mt-2 text-sm text-[#a84268]"></p>

            <!-- Chọn hồ sơ Bin / Zin -->
            <div class="mt-7 flex flex-wrap items-center justify-between gap-3">
                <div class="flex gap-2" role="tablist" aria-label="Chọn hồ sơ">
                    <button type="button" role="tab" id="tab-bin" aria-controls="profile-card" aria-selected="true"
                        data-person="bin" class="primary">🐻 Bin</button>
                    <button type="button" role="tab" id="tab-zin" aria-controls="profile-card" aria-selected="false"
                        data-person="zin" class="secondary">🌷 Zin</button>
                </div>
                <button type="button" id="edit-btn" class="secondary">✏️ Chỉnh sửa hồ sơ</button>
            </div>

            <!-- Khung hiển thị hồ sơ -->
            <article id="profile-card" role="tabpanel" aria-labelledby="tab-bin"
                class="glass mt-6 grid md:grid-cols-[minmax(0,320px)_1fr] gap-8 rounded-[32px] p-5 md:p-8 items-center">
                <!-- Cột ảnh đại diện -->
                <div class="profile-avatar-wrap">
                    <div id="avatar-box" class="profile-avatar-box">
                        <img id="view-photo" alt="Ảnh đại diện" class="profile-avatar-img" hidden>
                        <div id="view-placeholder" class="profile-avatar-placeholder">
                            <span id="placeholder-emoji" class="text-6xl" aria-hidden="true">🧸</span>
                            <span class="text-sm text-[#876777] mt-2">Chưa có ảnh đại diện</span>
                        </div>
                    </div>
                    <div class="mt-3 flex flex-wrap justify-center gap-2">
                        <label for="avatar-input" class="secondary text-sm cursor-pointer inline-block">📷 Đổi ảnh đại diện</label>
                        <input id="avatar-input" type="file" accept="image/*" class="sr-only">
                        <button type="button" id="remove-photo-btn" class="secondary text-sm" hidden>🗑 Xóa ảnh</button>
                    </div>
                </div>

                <!-- Cột thông tin (Chế độ xem) -->
                <div id="view-pane" class="self-center">
                    <h2 id="view-name" class="text-[#713d53]"></h2>
                    <p id="view-bio" class="mt-3 text-[#876777] text-lg"></p>

                    <h3 class="mt-6 text-[#a84268]">Thông tin cơ bản</h3>
                    <p id="view-about" class="mt-2 whitespace-pre-line leading-relaxed"></p>

                    <h3 class="mt-6 text-[#a84268]">Sở thít ♡</h3>
                    <p id="view-likes" class="mt-2 whitespace-pre-line leading-relaxed"></p>
                </div>

                <!-- Cột thông tin (Chế độ chỉnh sửa) -->
                <form id="edit-form" class="self-center space-y-4" hidden>
                    <div>
                        <label for="input-name" class="mb-1 block text-sm font-semibold">Tên hiển thị</label>
                        <input id="input-name" class="field" maxlength="60" required>
                    </div>
                    <div>
                        <label for="input-bio" class="mb-1 block text-sm font-semibold">Giới thiệu ngắn (Bio)</label>
                        <input id="input-bio" class="field" maxlength="160" required>
                    </div>
                    <div>
                        <label for="input-about" class="mb-1 block text-sm font-semibold">Thông tin cơ bản (mỗi mục 1 dòng)</label>
                        <textarea id="input-about" class="field min-h-28" maxlength="1500" required></textarea>
                    </div>
                    <div>
                        <label for="input-likes" class="mb-1 block text-sm font-semibold">Sở thích ♡</label>
                        <textarea id="input-likes" class="field min-h-24" maxlength="1000" required></textarea>
                    </div>
                    <div class="flex flex-wrap gap-3 pt-2">
                        <button type="submit" id="save-btn" class="primary">💾 Lưu thay đổi</button>
                        <button type="button" id="cancel-btn" class="secondary">Hủy</button>
                    </div>
                </form>
            </article>
        </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="nav.js?v=5"></script>
    <script src="profile.js?v=2"></script>
</body>

</html>
