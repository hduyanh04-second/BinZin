<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đôi lời mún nói 💌 | Bin Zin</title>
    <link rel="stylesheet" href="styles.css?v=8">
    <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
    <!-- Firebase (bản compat, chạy được cả khi mở file trực tiếp) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>

<body class="w-full">
    <div class="app-wrapper min-h-screen flex flex-col">
        <header class="border-b border-white/70 bg-white/50">
            <div class="mx-auto max-w-6xl px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                <a href="index.html" class="canva-button font-bold text-[#c85578]">BinZin World 💕</a>
                <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Mở menu" aria-controls="main-nav"
                    aria-expanded="false">
                    <span class="menu-bar"></span><span class="menu-bar"></span><span class="menu-bar"></span>
                </button>
                <nav id="main-nav" aria-label="Điều hướng chính" class="main-nav">
                    <a href="index.html#home" class="canva-button nav-btn">Home</a>
                    <a href="profile.html" class="canva-button nav-btn">Profile</a>
                    <a href="letter.html" class="canva-button nav-btn active" aria-current="page">Đôi lời mún nói</a>
                    <a href="index.html#calendar" class="canva-button nav-btn">Ngày mấy iu nhau 🧐</a>
                    <a href="photos.html" class="canva-button nav-btn">Photographs</a>
                    <a href="index.html#wheel" class="canva-button nav-btn">Hôm nay ăn gì 🎡</a>
                    <a href="index.html#games" class="canva-button nav-btn">Game</a>
                </nav>
            </div>
        </header>

        <main class="mx-auto w-full max-w-3xl px-4 sm:px-5 py-8 md:py-12 flex-1 flex flex-col">
            <h1 class="text-center text-[#713d53]">Đôi lời mún nói 💌</h1>
            <p class="mt-3 text-center text-[#876777]">Gửi nhau những lời thương, mỗi lời nhắn là một khung chat
                nho nhỏ ♡</p>
            <p id="chat-status" role="status" class="mt-3 text-center text-sm text-[#a84268]"></p>

            <section aria-label="Các lời nhắn" class="glass mt-6 rounded-[32px] p-4 sm:p-6 flex-1 flex flex-col">
                <ol id="chat-list" class="chat-list" aria-live="polite"></ol>
                <p id="chat-empty" class="text-center text-[#876777] py-10" hidden>Chưa có lời nhắn nào. Viết lời
                    đầu tiên nha 💕</p>
            </section>

            <form id="chat-form" class="glass mt-5 rounded-[28px] p-4 sm:p-6 space-y-3">
                <div class="grid sm:grid-cols-2 gap-3">
                    <fieldset>
                        <legend class="mb-1 block text-sm font-semibold">Bạn là ai?</legend>
                        <div class="name-choice">
                            <label><input type="radio" name="chat-name" value="Bin" required><span>🐻 Bin</span></label>
                            <label><input type="radio" name="chat-name" value="Zin"><span>🐰 Zin</span></label>
                        </div>
                    </fieldset>
                    <div>
                        <label for="chat-title" class="mb-1 block text-sm font-semibold">Tiêu đề</label>
                        <input id="chat-title" class="field" maxlength="120" required placeholder="Gửi cậu…">
                    </div>
                </div>
                <div>
                    <label for="chat-content" class="mb-1 block text-sm font-semibold">Nội dung</label>
                    <textarea id="chat-content" class="field min-h-28" maxlength="3000" required
                        placeholder="Viết điều muốn nói…"></textarea>
                </div>
                <button type="submit" class="primary w-full">Gửi lời nhắn 💌</button>
            </form>
        </main>
    </div>
    <script src="nav.js?v=4"></script>
    <script src="letter.js"></script>
</body>

</html>
